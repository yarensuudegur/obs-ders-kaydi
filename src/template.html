<div class="login" id="viewLogin">
  <form class="login-card" id="loginForm" autocomplete="off" novalidate>
    <button class="login-lang" type="button" id="loginLang"><svg><use href="#i-globe"/></svg><span id="loginLangLabel"></span></button>
    <div class="login-logo"><img class="logo-src" alt="" width="104" height="104"></div>
    <h1 class="login-uni" data-i18n="top.uni"></h1>
    <div class="login-role"><span data-i18n="login.role"></span></div>
    <div class="login-demo" data-i18n="login.demo"></div>
    <label class="sr-only" for="loginNo" data-i18n="pf.number"></label>
    <input class="l-in" id="loginNo" type="text" readonly tabindex="-1">
    <div class="l-pass">
      <label class="sr-only" for="loginPass" data-i18n="login.pass"></label>
      <input class="l-in" id="loginPass" type="password" readonly tabindex="-1" value="demo-sifre">
      <button type="button" class="l-eye" id="loginEye" data-i18n-aria="login.show"><svg><use href="#i-eyeoff"/></svg></button>
    </div>
    <div class="l-captcha">
      <div class="l-q" id="capQ" aria-live="polite"></div>
      <button type="button" class="l-icon off" data-i18n-aria="login.listen"><svg><use href="#i-sound"/></svg></button>
      <button type="button" class="l-icon" id="capNew" data-i18n-aria="login.newQ"><svg><use href="#i-refresh"/></svg></button>
      <label class="sr-only" for="capA" data-i18n="login.code"></label>
      <input class="l-in" id="capA" type="text" inputmode="numeric" maxlength="3" data-i18n-ph="login.code">
    </div>
    <div class="l-err" id="loginErr" role="alert"></div>
    <button type="submit" class="l-btn"><svg><use href="#i-login"/></svg><span data-i18n="login.enter"></span></button>
    <a class="l-link off" data-i18n="login.forgot"></a>
    <button type="button" class="l-edevlet off"><span data-i18n="login.edevlet"></span></button>
    <div class="l-timer"><span data-i18n="login.timer"></span> <b id="loginTimer">05:00</b></div>
    <div class="l-news off" data-i18n="login.news"></div>
  </form>
  <p class="login-foot" data-i18n="login.foot"></p>
</div>

<div class="shell view-hidden" id="shell">
  <div class="side-backdrop" id="sideBackdrop"></div>
  <aside class="side" aria-label="Menu">
    <div class="side-logo"><img class="crest-img logo-src" alt="Yaşar Üniversitesi" width="84" height="84"></div>
    <div class="side-sys" data-i18n="side.sys"></div>
    <label class="side-search"><svg><use href="#i-search"/></svg><input type="text" data-i18n-ph="side.search" disabled></label>
    <nav class="side-nav">
      <a class="item data-item" href="#" data-view="data"><svg><use href="#i-upload"/></svg><span data-i18n="side.data"></span><span class="nav-count" id="navDataCount"></span></a>
      <div class="grp" data-i18n="side.g.general"></div>
      <a class="item grp-toggle open" href="#" data-toggle="g1"><svg><use href="#i-grid"/></svg><span data-i18n="side.general"></span><svg class="chev down"><use href="#i-chev"/></svg></a>
      <div class="sub" id="sub-g1">
        <a class="item off" data-i18n="side.manual"></a>
        <a class="item off" data-i18n="side.personal"></a>
        <a class="item off" data-i18n="side.info"></a>
        <a class="item" href="#" data-view="calendar" data-i18n="side.calendar"></a>
        <a class="item off" data-i18n="side.advisorInfo"></a>
        <a class="item" href="#" data-view="courses" data-i18n="side.taken"></a>
        <a class="item" href="#" data-view="offered" data-i18n="side.offered"></a>
        <a class="item" href="#" data-view="exams" data-i18n="side.exams"></a>
        <a class="item" href="#" data-view="tt" data-i18n="side.timetable"></a>
        <a class="item" href="#" data-view="depttt" data-i18n="side.depttt"></a>
        <a class="item off" data-i18n="side.fees"></a>
        <a class="item off" data-i18n="side.internship"></a>
        <a class="item off" data-i18n="side.news"></a>
        <a class="item off" data-i18n="side.gradApproval"></a>
        <a class="item" href="#" data-view="grad" data-i18n="side.grad"></a>
      </div>
      <a class="item grp-toggle open" href="#" data-toggle="g2"><svg><use href="#i-book"/></svg><span data-i18n="side.course"></span><svg class="chev down"><use href="#i-chev"/></svg></a>
      <div class="sub" id="sub-g2">
        <a class="item active" href="#" data-view="reg" data-i18n="side.reg"></a>
        <a class="item" href="#" data-view="adddrop" data-i18n="side.adddrop"></a>
        <a class="item" href="#" data-view="averages" data-i18n="side.averages"></a>
        <a class="item" href="#" data-view="gradebook" data-i18n="side.grades"></a>
        <a class="item" href="#" data-view="transcript" data-i18n="side.transcript"></a>
        <a class="item" href="#" data-view="scenario" data-i18n="side.scenario"></a>
        <a class="item" href="#" data-view="docs" data-i18n="side.otherDocs"></a>
        <a class="item" href="#" data-view="curr" data-i18n="side.curr"></a>
        <a class="item off" data-i18n="side.package"></a>
        <a class="item off" data-i18n="side.attendance"></a>
      </div>
      <a class="item off"><svg><use href="#i-form"/></svg><span data-i18n="side.forms"></span><svg class="chev"><use href="#i-chev"/></svg></a>
      <a class="item off"><svg><use href="#i-doc"/></svg><span data-i18n="side.docs"></span><svg class="chev"><use href="#i-chev"/></svg></a>
      <div class="grp" data-i18n="side.g.academic"></div>
      <a class="item off"><svg><use href="#i-swap"/></svg><span data-i18n="side.transfer"></span><svg class="chev"><use href="#i-chev"/></svg></a>
      <a class="item off"><svg><use href="#i-lang"/></svg><span data-i18n="side.prep"></span><svg class="chev"><use href="#i-chev"/></svg></a>
      <div class="grp" data-i18n="side.g.apply"></div>
      <a class="item off"><svg><use href="#i-inbox"/></svg><span data-i18n="side.applications"></span><svg class="chev"><use href="#i-chev"/></svg></a>
      <div class="grp" data-i18n="side.g.account"></div>
      <a class="item off"><svg><use href="#i-user"/></svg><span data-i18n="side.user"></span><svg class="chev"><use href="#i-chev"/></svg></a>
    </nav>
  </aside>

  <div class="main-col">
    <header class="top">
      <button class="icon-btn" id="menuBtn" type="button" data-i18n-aria="top.menu"><svg><use href="#i-menu"/></svg></button>
      <div class="uni" data-i18n="top.uni"></div>
      <div class="term-pill" id="termPill"></div>
      <button class="date-chip" id="dateChip" type="button"></button>
      <div class="top-right">
        <div class="lang" role="group" data-i18n-aria="top.lang" id="langSeg">
          <button type="button" data-lang="tr">TR</button><button type="button" data-lang="en">EN</button>
        </div>
        <button class="icon-btn" type="button" data-view="home" data-i18n-aria="top.home"><svg><use href="#i-home"/></svg></button>
        <div class="bell-wrap">
          <button class="icon-btn" id="bellBtn" type="button" data-i18n-aria="top.news"><svg><use href="#i-bell"/></svg><span class="dot" id="bellDot">0</span></button>
          <div class="bell-pop" id="bellPop" hidden></div>
        </div>
        <button class="me" id="meBtn" type="button" data-i18n-title="top.profile">
          <span class="avatar" id="avatar"></span><span id="meName"></span>
        </button>
        <button class="icon-btn" id="logoutBtn" type="button" data-i18n-aria="top.logout" data-i18n-title="top.logout"><svg><use href="#i-logout"/></svg></button>
      </div>
    </header>

    <main class="page" id="viewHome">
      <div class="home-banner" id="homeBanner"><svg><use href="#i-info"/></svg><span id="homeBannerText"></span><button class="icon-btn small" type="button" id="homeBannerX" data-i18n-aria="howto.close"><svg><use href="#i-x"/></svg></button></div>
      <div class="home-grid" id="homeGrid"></div>
    </main>

    <main class="page view-hidden" id="viewPage"></main>

    <main class="page view-hidden" id="viewReg">
      <div class="page-head">
        <div>
          <h1 data-i18n="page.title"></h1>
          <p class="lead" data-i18n="page.lead"></p>
        </div>
        <button class="btn soft off" type="button"><span data-i18n="page.options"></span> <svg class="chev down"><use href="#i-chev"/></svg></button>
      </div>

      <div class="status-row">
        <div class="stat"><span class="k" data-i18n="stat.finance"></span><span class="v ok" data-i18n="stat.financeOk"></span></div>
        <div class="stat"><span class="k" data-i18n="stat.advisor"></span><span class="v wait" id="advisorState"></span></div>
        <div class="stat"><span class="k" data-i18n="stat.semester"></span><span class="v" id="semState"></span></div>
        <div class="stat ects" id="ects"></div>
      </div>


      <section class="card filters">
        <div class="f-group">
          <label class="f-label" for="termSel" data-i18n="f.term"></label>
          <select id="termSel"></select>
        </div>
        <div class="f-group">
          <span class="f-label" data-i18n="f.years"></span>
          <div class="checks-row" id="yearChecks"></div>
        </div>
      </section>

      <section class="ai-card">
        <div class="ai-icon" aria-hidden="true"><svg><use href="#i-spark"/></svg></div>
        <div class="ai-text">
          <h2 data-i18n="ai.title"></h2>
        </div>
        <button class="btn ai-btn" id="aiBtn" type="button"><svg><use href="#i-spark"/></svg><span data-i18n="ai.open"></span></button>
      </section>

      <div id="warnings"></div>

      <section class="card">
        <div class="card-head"><h2 data-i18n="req.title"></h2><span class="count" id="reqCount"></span></div>
        <div id="reqList" class="req-list"></div>
      </section>

      <section class="card flush">
        <div class="card-head pad"><h2 data-i18n="grid.title"></h2><span class="muted small" data-i18n="grid.hint"></span></div>
        <div class="day-tabs" id="dayTabs" role="tablist"></div>
        <div class="grid-wrap"><table class="grid" id="grid"></table></div>
      </section>

      <section class="card flush">
        <div class="card-head pad"><h2 data-i18n="sel.title"></h2><div class="head-btns"><button class="btn soft" id="pngBtn" type="button"><svg><use href="#i-download"/></svg><span data-i18n="png.btn"></span></button><button class="btn primary" id="finishBtn" type="button" data-i18n="sel.finish"></button></div></div>
        <div class="table-wrap"><table class="sel-table" id="selTable"></table></div>
      </section>

      <section class="legend">
        <span><i class="lg sel"></i><span data-i18n="lg.sel"></span></span>
        <span><i class="lg fixed"></i><span data-i18n="lg.fixed"></span></span>
        <span><i class="lg black"></i><span data-i18n="lg.black"></span></span>
        <span><i class="lg grey"></i><span data-i18n="lg.grey"></span></span>
        <span><i class="lg pas"></i><span data-i18n="lg.pas"></span></span>
        <span><i class="lg extra"></i><span data-i18n="lg.extra"></span></span>
        <span><i class="lg prereq"></i><span data-i18n="lg.prereq"></span></span>
        <span><i class="lg passed"></i><span data-i18n="lg.passed"></span></span>
      </section>
    </main>

    <main class="page view-hidden" id="viewTT">
      <div class="page-head">
        <div>
          <h1 data-i18n="tt.title"></h1>
          <p class="lead" data-i18n="tt.lead"></p>
        </div>
        <div class="tt-tools">
          <button class="btn soft off fake-select" type="button"><span class="muted small" data-i18n="tt.term"></span><b id="ttTermLabel"></b><svg class="chev down"><use href="#i-chev"/></svg></button>
          <button class="btn soft off" type="button"><svg><use href="#i-print"/></svg><span data-i18n="tt.print"></span></button>
          <button class="btn primary" type="button" id="ttPngBtn"><svg><use href="#i-download"/></svg><span data-i18n="png.btn"></span></button>
        </div>
      </div>
      <div id="ttBody"></div>
    </main>
  </div>
</div>

<div class="notice" id="notice" role="status" aria-live="polite"></div>

<div class="session" data-i18n-title="session"><svg><use href="#i-clock"/></svg><span id="timer">59:59</span></div>
<div class="tip" id="tip" role="tooltip"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<dialog id="profileDlg">
  <form method="dialog" class="dlg wide pf-dlg">
    <h2 data-i18n="pf.title"></h2>
    <p class="muted small" data-i18n="pf.lead"></p>
    <div class="pf-grid">
      <label class="pf-f"><span data-i18n="pf.first"></span><input id="pfFirst" type="text" autocomplete="off"></label>
      <label class="pf-f"><span data-i18n="pf.last"></span><input id="pfLast" type="text" autocomplete="off"></label>
      <label class="pf-f"><span data-i18n="pf.number"></span><input id="pfNumber" type="text" inputmode="numeric" autocomplete="off"></label>
      <label class="pf-f"><span data-i18n="pf.year"></span><select id="pfYear"><option value="1"></option><option value="2"></option><option value="3"></option><option value="4"></option></select></label>
      <label class="pf-f"><span data-i18n="pf.gpa"></span><input id="pfGpa" type="number" min="0" max="4" step="0.01"></label>
      <div class="pf-f pf-limit"><span data-i18n="pf.limit"></span><b id="pfLimitOut"></b><small class="muted" data-i18n="pf.limitRule"></small></div>
    </div>
    <div class="pf-courses-head"><h3 data-i18n="pf.courses"></h3><p class="muted small" data-i18n="pf.coursesHint"></p></div>
    <div id="pfCourses" class="pf-courses"></div>
    <div class="dlg-actions">
      <span class="muted small" style="margin-right:auto" data-i18n="pf.reset"></span>
      <button class="btn soft" value="cancel" type="submit" data-i18n="pf.cancel"></button>
      <button class="btn primary" value="ok" id="pfSave" type="submit" data-i18n="pf.save"></button>
    </div>
  </form>
</dialog>

<dialog id="aiDlg">
  <div class="dlg ai-dlg">
    <div class="ai-head">
