        <button class="btn small soft" type="button" data-rules><svg><use href="#i-edit"/></svg>${esc(t('rules.edit'))}</button>`;
    }
    return `<article class="dc-card ${loaded ? 'ok' : ''}" data-kind="${k.id}">
      <div class="dc-top"><span class="dc-ic"><svg><use href="#i-${k.icon}"/></svg></span><div class="dc-tt"><h3>${esc(t('dc.k.' + k.id))}</h3><span class="who ${k.who}">${esc(t('dc.who.' + k.who))}</span></div>
        <span class="dc-state ${loaded ? 'ok' : ''}">${loaded ? OBS.CHECK + esc(t('dc.ok')) : esc(t('dc.waiting'))}</span></div>
      <p class="dc-desc">${esc(t('dc.d.' + k.id))}</p>
      ${loaded ? `<p class="dc-sum">${esc(summary(k.id))}</p>` : ''}
      ${body}
      <div class="dc-used"><span>${esc(t('dc.usedBy'))}</span>${k.used.map((v) => `<button type="button" class="mini-chip" data-goto="${v}">${esc(t(v === 'reg' ? 'side.reg' : 'side.' + ({ curr: 'curr', grad: 'grad', scenario: 'scenario', adddrop: 'adddrop', offered: 'offered', depttt: 'depttt', calendar: 'calendar', exams: 'exams', averages: 'averages', transcript: 'transcript' }[v])))}</button>`).join('')}</div>
      <div class="dc-btns">
        <button class="btn small primary" type="button" data-upload="${k.id}"><svg><use href="#i-upload"/></svg>${esc(t(loaded && !k.multi ? 'dc.replace' : 'dc.upload'))}</button>
        ${k.paste ? `<button class="btn small soft" type="button" data-paste><svg><use href="#i-paste"/></svg>${esc(t('dc.paste'))}</button>` : ''}
        <button class="btn small ghost" type="button" data-sample="${k.id}"><svg><use href="#i-download"/></svg>${esc(t('dc.sample'))}</button>
        ${loaded && !k.multi ? `<button class="btn small ghost" type="button" data-rmkind="${k.id}">${esc(t('dc.remove'))}</button>` : ''}
      </div>
      <div class="dc-fmt">${esc(t('dc.formats'))} ${esc(k.accept.replace(/\./g, '').toUpperCase().replace(/,/g, ', '))} · ${esc(t('dc.src.' + k.id))}</div>
    </article>`;
  }

  OBS.views.data = {
    title: 'side.data',
    render() {
      const n = KINDS.filter((k) => has(k.id)).length;
      const uni = KINDS.filter((k) => k.who !== 'student');
      const stu = KINDS.filter((k) => k.who === 'student');
      return `<div class="page-head"><div><h1>${esc(t('dc.title'))}</h1><p class="lead">${esc(t('dc.lead'))}</p></div></div>
        <section class="card dc-hero">
          <div class="dc-prog"><div class="top-line"><span class="k">${esc(t('dc.progress'))}</span><span class="big">${n} / ${KINDS.length}</span></div><div class="bar"><i style="width:${(n / KINDS.length) * 100}%"></i></div></div>
          <div class="dc-actions"><button class="btn primary" type="button" data-samples><svg><use href="#i-spark"/></svg>${esc(t('dc.samplesAll'))}</button>${n ? `<button class="btn soft" type="button" data-clear><svg><use href="#i-trash"/></svg>${esc(t('dc.clear'))}</button>` : ''}</div>
          <label class="dropzone" data-drop="auto"><input type="file" multiple data-upload-input="auto" hidden><svg><use href="#i-upload"/></svg><span><b>${esc(t('dc.dropT'))}</b>${esc(t('dc.dropL'))}</span></label>
          <p class="dc-privacy"><svg><use href="#i-info"/></svg>${esc(t('dc.privacy'))}</p>
        </section>
        <h2 class="dc-group">${esc(t('dc.gUni'))}</h2>
        <div class="dc-grid">${uni.map(card).join('')}</div>
        <h2 class="dc-group">${esc(t('dc.gStudent'))}</h2>
        <div class="dc-grid">${stu.map(card).join('')}
          <article class="dc-card docs-card"><div class="dc-top"><span class="dc-ic"><svg><use href="#i-folder"/></svg></span><div class="dc-tt"><h3>${esc(t('side.otherDocs'))}</h3><span class="who student">${esc(t('dc.who.student'))}</span></div><span class="dc-state">${(DATA.docs || []).length}</span></div>
            <p class="dc-desc">${esc(t('dc.d.docs'))}</p><div class="dc-btns"><button class="btn small soft" type="button" data-goto="docs">${esc(t('dc.openDocs'))}</button></div></article>
        </div>
        <section class="card dc-api"><div class="card-head"><h2>${esc(t('api.title'))}</h2></div>
          <p class="muted">${esc(t('api.lead'))}</p>
          <div class="api-flow"><div><b>${esc(t('api.today'))}</b><span>${esc(t('api.todayL'))}</span></div><svg><use href="#i-chev"/></svg><div><b>${esc(t('api.conn'))}</b><span>${esc(t('api.connL'))}</span></div><svg><use href="#i-chev"/></svg><div><b>${esc(t('api.tomorrow'))}</b><span>${esc(t('api.tomorrowL'))}</span></div></div>
          <table class="api-t"><thead><tr><th>${esc(t('api.endpoint'))}</th><th>${esc(t('api.replaces'))}</th></tr></thead><tbody>
            ${[['GET /api/curriculum', 'curriculum'], ['GET /api/terms/{term}/sections', 'timetable'], ['GET /api/terms/{term}/quota', 'quota'], ['GET /api/calendar', 'calendar'], ['GET /api/students/{no}/exams', 'exams'], ['GET /api/students/{no}/transcript', 'transcript'], ['POST /api/students/{no}/registration', 'reg']].map(([e, k]) => `<tr><td><code>${e}</code></td><td>${esc(k === 'reg' ? t('api.submit') : t('dc.k.' + k))}</td></tr>`).join('')}
          </tbody></table></section>`;
    },
  };

  // ---------- Olaylar ----------
  let pendingUpload = null;
  function pick(kind, opts) {
    const k = KINDS.find((x) => x.id === kind);
    const inp = $('fileIn');
    inp.accept = k ? k.accept : '';
    inp.multiple = !k || !!k.multi;
    inp.value = '';
    pendingUpload = { kind, opts };
    inp.click();
  }
  function bindData() {
    $('fileIn').addEventListener('change', (e) => {
      const files = [...e.target.files];
      if (files.length && pendingUpload) ingestFiles(pendingUpload.kind, files, pendingUpload.opts);
      pendingUpload = null;
    });
    document.addEventListener('click', (e) => {
      const q = (s) => e.target.closest(s);
      let b;
      if ((b = q('[data-upload]'))) { e.preventDefault(); pick(b.dataset.upload); return; }
      if ((b = q('[data-samples]'))) { e.preventDefault(); loadAllSamples(); return; }
      if ((b = q('[data-sample]'))) {
        const k = KINDS.find((x) => x.id === b.dataset.sample);
        k.samples.forEach((n, i) => setTimeout(() => OBS.download(n, new Blob([sampleBytes(n)], { type: MIME[extOf(n)] })), i * 300));
        return;
      }
      if ((b = q('[data-rmkind]'))) { removeKind(b.dataset.rmkind); return; }
      if ((b = q('[data-rmdoc]'))) { OBS.removeDoc(b.dataset.rmdoc); return; }
      if ((b = q('[data-dl]'))) { OBS.downloadDoc(b.dataset.dl); return; }
      if (q('[data-clear]')) { clearAll(); return; }
      if (q('[data-paste]')) { openPaste(); return; }
      if (q('[data-rules]')) { openRules(); return; }
      if (q('#dateChip')) { openDate(); return; }
      if ((b = q('[data-setdate]'))) { setDate(b.dataset.setdate); return; }
      if ((b = q('[data-toggle]'))) {
        e.preventDefault();
        b.classList.toggle('open');
        $('sub-' + b.dataset.toggle).classList.toggle('closed', !b.classList.contains('open'));
        b.querySelector('.chev').classList.toggle('down', b.classList.contains('open'));
        return;
      }
      if ((b = q('.dropzone'))) { e.preventDefault(); pick('auto'); }
    });
    document.addEventListener('change', (e) => {
      const s = e.target.closest('[data-ttyear]');
      if (!s) return;
      const x = DATA.timetable.find((tt) => tt.file.id === s.dataset.ttyear);
      if (!x) return;
      x.data.year = s.value || null;
      DATA.timetable = DATA.timetable.filter((tt) => tt === x || !(tt.data.year && tt.data.year === x.data.year && tt.data.term === x.data.term));
      saveData();
      dataChanged(false);
    });
    // Sürükle-bırak: karta bırakılan dosya o türde, genel alana bırakılan otomatik tanınır
    document.addEventListener('dragover', (e) => {
      const z = e.target.closest('.dc-card[data-kind], .dropzone');
      if (!z) return;
      e.preventDefault();
      document.querySelectorAll('.drag-on').forEach((x) => x.classList.remove('drag-on'));
      z.classList.add('drag-on');
    });
    document.addEventListener('dragleave', (e) => { const z = e.target.closest('.drag-on'); if (z && !z.contains(e.relatedTarget)) z.classList.remove('drag-on'); });
    document.addEventListener('drop', (e) => {
      const z = e.target.closest('.dc-card[data-kind], .dropzone');
      if (!z) return;
      e.preventDefault();
      z.classList.remove('drag-on');
      const files = [...(e.dataTransfer.files || [])];
      if (files.length) ingestFiles(z.dataset.kind || 'auto', files);
    });
  }

  OBS.initData = () => {
    DATA = ls.get(LS_DATA) || {};
    loadState();
    const muf = DATA.curriculum ? DATA.curriculum.data : null;
    OBS.setData(muf, buildProg());
    app.rules = { ...PARSE.DEFAULT_RULES, ...((DATA.regulation && DATA.regulation.rules) || {}) };
    applyStudent();
    if (!DATA.transcript) {
      const tt = (DATA.timetable || []).find((x) => x.data.term === app.term && x.data.academicYear);
      app.ay = (DATA.calendar && DATA.calendar.data.academicYear) || (tt && tt.data.academicYear) || '2026-2027';
    }
    if (!app.layers.size) app.layers = new Set([`${app.profile.year}|${app.term}`]);
    bindData();
  };
})();

// Genel İşlemler sayfaları: Akademik Takvim, Alınan Dersler, Açılan Bölüm Dersleri, Sınav Takvimi, Bölüm Ders Programı, Mezuniyet İlerleme Durumu
(function () {
  const { app, t, esc, $ } = OBS;
  const D = () => OBS.data();
  const MUF = () => OBS.getData().MUF;
  const PROG = () => OBS.getData().PROG;
  const course = (code) => { const m = MUF(); return m ? m.courses.find((c) => c.code === code) : null; };
  const head = (titleKey, lead, actions = '') => `<div class="page-head"><div><h1>${esc(t(titleKey))}</h1>${lead ? `<p class="lead">${esc(lead)}</p>` : ''}</div>${actions ? `<div class="head-btns">${actions}</div>` : ''}</div>`;
  const empty = (title, text, btn) => `<section class="card"><div class="tt-empty"><b>${esc(title)}</b><p>${esc(text)}</p>${btn || ''}</div></section>`;
  OBS.pageHead = head;
  OBS.pageEmpty = empty;

  // Saatleri gün gün birleştir: "Sal 12:40–15:30 · Cum 08:40–10:30 (Lab)"
  function fmtSlots(slots) {
    const out = [];
    const sorted = [...slots].sort((a, b) => a.day - b.day || a.start.localeCompare(b.start));
    for (const s of sorted) {
      const last = out[out.length - 1];
      if (last && last.day === s.day && last.type === s.type && parseInt(s.start, 10) === parseInt(last.end, 10)) last.end = s.end;
      else out.push({ day: s.day, start: s.start, end: s.end, type: s.type, room: s.room });
    }
    return out.map((x) => `${OBS.daysShort()[x.day]} ${x.start}–${x.end}${x.type === 'U' ? ' (' + t('grid.lab') + ')' : ''}`).join(' · ');
  }
  OBS.fmtSlots = fmtSlots;
  const icon = (n) => `<svg><use href="#i-${n}"/></svg>`;

  // ---------- Akademik Takvim ----------
  const KIND_CLASS = { registration: 'reg', adddrop: 'ad', midterm: 'exam', final: 'exam', makeup: 'exam', holiday: 'hol', start: 'start', end: 'start', fee: 'fee', grades: 'start', withdraw: 'ad', other: 'other' };
  OBS.views.calendar = {
    title: 'side.calendar',
    needs: ['calendar'],
    render() {
      const ev = D().calendar.data.events;
      const today = OBS.today();
      const toIcs = (e) => ({ title: e.title, date: e.start, end: e.end, details: t('cal.icsNote') });
      const months = new Map();
      for (const e of ev) {
        const d = OBS.parseIso(e.start);
        const k = e.start.slice(0, 7);
        if (!months.has(k)) months.set(k, { label: d.toLocaleDateString(app.lang === 'tr' ? 'tr-TR' : 'en-GB', { month: 'long', year: 'numeric' }), list: [] });
        months.get(k).list.push(e);
      }
      const rowOf = (e, i) => {
        const end = e.end || e.start;
        const st = today > end ? 'past' : today >= e.start ? 'now' : 'next';
        const d = OBS.parseIso(e.start);
        const left = OBS.daysBetween(today, e.start);
        const when = st === 'now' ? t('cal.now') : st === 'past' ? t('cal.past') : left === 1 ? t('cal.tomorrow') : t('cal.inDays', { n: left });
        const jump = (e.kind === 'registration' || e.kind === 'adddrop') && st !== 'now' ? `<button class="btn small soft" type="button" data-setdate="${e.start}">${esc(t('cal.jump'))}</button>` : '';
        const go = e.kind === 'registration' && st === 'now' ? `<button class="btn small primary" type="button" data-goto="reg">${esc(t('side.reg'))}</button>` : e.kind === 'adddrop' && st === 'now' ? `<button class="btn small primary" type="button" data-goto="adddrop">${esc(t('side.adddrop'))}</button>` : '';
        return `<div class="ev-row ${st} k-${KIND_CLASS[e.kind]}">
          <div class="ev-date"><b>${d.getDate()}</b><span>${esc(d.toLocaleDateString(app.lang === 'tr' ? 'tr-TR' : 'en-GB', { weekday: 'short' }))}</span></div>
          <div class="ev-main"><b>${esc(e.title)}</b><span>${esc(OBS.fmtRange(e.start, e.end))}</span></div>
          <span class="kpill k-${KIND_CLASS[e.kind]}">${esc(t('cal.k.' + e.kind))}</span>
          <span class="ev-when">${esc(when)}</span>
          <div class="ev-act">${go}${jump}<a class="icon-btn small" href="${esc(OBS.gcalLink(toIcs(e)))}" target="_blank" rel="noopener" title="${esc(t('g.add'))}">${icon('gcal')}</a></div>
        </div>`;
      };
      const cur = ev.filter((e) => today >= e.start && today <= (e.end || e.start));
      const next = ev.find((e) => e.start > today);
      return head('side.calendar', D().calendar.data.academicYear ? t('cal.lead', { y: D().calendar.data.academicYear }) : '', `<button class="btn soft" type="button" data-calics>${icon('download')}${esc(t('cal.ics'))}</button>`) +
        `<section class="status-row cal-status">
          <div class="stat"><span class="k">${esc(t('cal.today'))}</span><span class="v">${esc(OBS.fmtDate(today))}</span></div>
          <div class="stat wide"><span class="k">${esc(t('cal.nowT'))}</span><span class="v">${cur.length ? cur.map((e) => esc(e.title)).join(', ') : esc(t('cal.nothing'))}</span></div>
          <div class="stat wide"><span class="k">${esc(t('cal.nextT'))}</span><span class="v">${next ? `${esc(next.title)} <small>(${esc(OBS.fmtShort(next.start))})</small>` : '-'}</span></div>
        </section>` +
        [...months.values()].map((m) => `<section class="card cal-month"><h2>${esc(m.label)}</h2>${m.list.map(rowOf).join('')}</section>`).join('');
    },
  };

  // ---------- Alınan Dersler ----------
  const typeOf = (it) => (it.kind === 'slot' ? it.slot[app.lang] : t(it.kind === 'retake' ? 'type.retake' : it.kind === 'extra' ? 'type.extra' : it.kind === 'upper' ? 'type.upper' : 'type.mandatory'));
  OBS.itemType = typeOf;
  OBS.views.courses = {
    title: 'side.taken',
    render() {
      const a = app.approved;
      if (!a) return head('side.taken') + empty(t('tt.emptyT'), t('taken.empty'), `<button class="btn primary" type="button" data-goto="reg">${esc(t('tt.goReg'))}</button>`);
      const credit = a.items.reduce((s, it) => s + ((course(it.code) || {}).credit || 0), 0);
      const tile = (ic, n, k, c) => `<div class="tile" style="--acc:${c}">${icon(ic)}<div><b>${n}</b><span>${esc(k)}</span></div></div>`;
      return head('side.taken', t('term.' + a.term), `<button class="btn soft" type="button" data-goto="tt">${icon('grid')}${esc(t('side.timetable'))}</button>`) +
        `<div class="tiles">${tile('book', a.items.length, t('taken.n'), '#3f7be0')}${tile('chart', credit, t('taken.credit'), '#14a383')}${tile('spark', a.ects, t('taken.ects'), '#e0a21b')}${tile('check', 0, t('taken.done'), '#e0533d')}</div>
        <div class="course-cards">${a.items.map((it) => {
          const c = course(it.code) || {};
          const tu = c.tul ? c.tul.split('+').slice(0, 2).join('+') : '-';
          return `<article class="ccard" style="--c:${it.color}"><div class="cc-main"><b>${esc(it.code)}</b><span class="nm">${esc(OBS.name(it.code))}</span>
            <div class="cc-meta"><span>${esc(t('taken.sec'))} <b>${it.section || '-'}</b></span><span>${esc(t('taken.cr'))} <b>${c.credit ?? '-'}</b></span><span>${esc(t('sel.ects'))} <b>${it.ects}</b></span><span>T+U: <b>${esc(tu)}</b></span></div></div>
            <div class="cc-side"><span class="pill">${esc(typeOf(it))}</span><span class="muted small">${esc(it.slots.length ? fmtSlots(it.slots) : it.online ? t('grid.online') : t('tt.noHours'))}</span><span class="muted small">${esc([...new Set(it.slots.map((x) => x.room).filter(Boolean))].join(', '))}</span></div></article>`;
        }).join('')}</div>`;
    },
  };

  // ---------- Açılan Bölüm Dersleri ----------
  const ui = { offTerm: null, offYear: 'all', offQ: '', ttKey: null, examAll: false };
  OBS.views.offered = {
    title: 'side.offered',
    needs: ['timetable'],
    render() {
      const prog = PROG();
      const terms = Object.keys(prog.terms);
      const term = ui.offTerm && terms.includes(ui.offTerm) ? ui.offTerm : terms.includes(app.term) ? app.term : terms[0];
      const years = Object.keys(prog.terms[term]).sort();
      const byCode = new Map();
      for (const y of years) {
        if (ui.offYear !== 'all' && ui.offYear !== y) continue;
        for (const s of prog.terms[term][y]) {
          if (!byCode.has(s.code)) byCode.set(s.code, { code: s.code, years: new Set(), secs: new Map() });
          const g = byCode.get(s.code);
          g.years.add(y);
          if (!g.secs.has(s.section)) g.secs.set(s.section, s);
        }
      }
      const m = MUF();
      const roleOf = (code) => {
        if (!m) return '';
        const sem = m.semesters.find((s) => s.mandatory.includes(code));
        if (sem) return t('off.mand', { n: sem.semester });
        const slot = m.semesters.flatMap((s) => s.electiveSlots).find((e) => Array.isArray(e.options) && e.options.includes(code));
        if (slot) return t('off.elec', { t: slot.type });
        return t('off.out');
      };
      const q = ui.offQ.toLocaleLowerCase('tr');
      const list = [...byCode.values()].filter((g) => !q || g.code.toLocaleLowerCase('tr').includes(q) || OBS.name(g.code).toLocaleLowerCase('tr').includes(q)).sort((a, b) => a.code.localeCompare(b.code));
      const ay = (D().timetable || []).find((x) => x.data.term === term);
      const quotaCell = (s) => {
        if (s.quota == null) return `<span class="muted small">${esc(t('off.noQuota'))}</span>`;
        const p = Math.min(100, Math.round((s.enrolled / s.quota) * 100));
        const full = s.enrolled >= s.quota;
        return `<div class="q ${full ? 'full' : p > 80 ? 'hi' : ''}"><span>${full ? esc(t('off.full')) : `${s.enrolled}/${s.quota}`}</span><i style="--p:${p}%"></i></div>`;
      };
      return head('side.offered', t('off.lead', { term: `${ay && ay.data.academicYear ? ay.data.academicYear : app.ay} ${t('tshort.' + term)}`, n: list.length })) +
        `<section class="card filters">
          <div class="f-group"><span class="f-label">${esc(t('off.term'))}</span><div class="seg">${terms.map((x) => `<button type="button" data-offterm="${x}" class="${x === term ? 'on' : ''}">${esc(t('tshort.' + x))}</button>`).join('')}</div></div>
          <div class="f-group"><span class="f-label">${esc(t('off.year'))}</span><div class="seg"><button type="button" data-offyear="all" class="${ui.offYear === 'all' ? 'on' : ''}">${esc(t('off.all'))}</button>${years.map((y) => `<button type="button" data-offyear="${y}" class="${ui.offYear === y ? 'on' : ''}">${esc(t('f.year', { y }))}</button>`).join('')}</div></div>
          <div class="f-group grow"><label class="f-label" for="offQ">${esc(t('off.search'))}</label><input id="offQ" type="search" value="${esc(ui.offQ)}" placeholder="${esc(t('off.searchPh'))}"></div>
        </section>
        <section class="card flush"><div class="table-wrap"><table class="sel-table off-table"><thead><tr><th>${esc(t('sel.code'))}</th><th>${esc(t('sel.name'))}</th><th>${esc(t('off.type'))}</th><th class="num">${esc(t('sel.ects'))}</th><th>${esc(t('off.secs'))}</th></tr></thead><tbody>
        ${list.map((g) => `<tr><td><span class="sw" style="--c:${OBS.hashColor(g.code)}"></span><b>${esc(g.code)}</b><div class="muted small">${[...g.years].map((y) => esc(t('f.year', { y }))).join(', ')}</div></td><td>${esc(OBS.name(g.code))}</td><td class="small">${esc(roleOf(g.code))}</td><td class="num">${(course(g.code) || {}).ects ?? '-'}</td>
          <td><div class="secs">${[...g.secs.values()].sort((a, b) => a.section - b.section).map((s) => `<div class="sec-line"><b>${esc(t('grid.section', { n: s.section }))}</b><span>${esc(fmtSlots(s.slots))}</span><span class="muted">${esc([...new Set(s.slots.map((x) => x.room).filter(Boolean))].join(', '))}</span>${quotaCell(s)}</div>`).join('')}</div></td></tr>`).join('') || `<tr><td colspan="5" class="empty">${esc(t('off.none'))}</td></tr>`}
        </tbody></table></div></section>`;
    },
  };

  // ---------- Sınav Takvimi ----------
  function myExams() {
    const all = D().exams.data.exams;
    const a = app.approved;
    if (!a || ui.examAll) return { list: all, mine: false };
    const codes = new Set(a.items.map((x) => x.code));
    const secOf = new Map(a.items.map((x) => [x.code, x.section]));
    return { list: all.filter((e) => codes.has(e.code) && (!e.section || !secOf.get(e.code) || e.section === secOf.get(e.code))), mine: true };
  }

      const row = (k, v) => `<div class="hc-row"><span>${esc(k)}</span><b>${esc(v)}</b></div>`;

      const total = Math.round((gp.ects.pct + gp.mandatory.pct + gp.elective.pct + gp.internship.pct + (gp.gpa.ok ? 100 : gp.gpa.pct)) / 5);
      const lists = (arr, empty) => arr.length ? arr.map((x) => `<tr><td><b>${esc(x.kind === 'slot' ? 'ELECT ' + x.code : x.code)}</b></td><td>${esc(x.kind === 'slot' ? (app.lang === 'en' ? x.nameEn : x.name) : OBS.name(x.code))}</td><td class="num">${x.ects}</td><td>${esc(t(x.zs === 'Z' ? 'grad.z' : 'grad.s'))}</td><td class="muted small">${x.kind === 'slot' ? esc(t('grad.group')) : ''}</td></tr>`).join('') : `<tr><td colspan="5" class="empty">${esc(empty)}</td></tr>`;
      const failed = gp.failed.map((x) => `<tr><td>${esc(x.taken.term)}</td><td><b>${esc(x.taken.code)}</b></td><td>${esc(OBS.name(x.code))}</td><td class="num">${x.ects}</td><td>${esc(t(x.zs === 'Z' ? 'grad.z' : 'grad.s'))}</td><td class="bad">${esc(x.taken.letter)}</td></tr>`).join('');
      return head('side.grad', regSrc, `<button class="btn soft" type="button" data-goto="data">${icon('doc')}${esc(t('grad.rules'))}</button>`) +
        `<div class="ggrid four">

          ${box('info', t('home.status'), row(t('home.regDate'), `29.08.${OBS.entryYear()}`) + row(t('home.regReason'), t('home.regReasonV')) + row(t('home.stateK'), t('home.stateV')), '#3f7be0')}
          ${box('hourglass', t('grad.time'), row(t('grad.semNow'), String(st.semester)) + row(t('grad.normalMax'), `${r.normalYears} / ${r.maxYears}`) + `<div class="gline">${bar(gp.time.pct)}</div>`, '#14a383')}
          ${box('doc', t('grad.state'), row(t('home.gpa'), OBS.fmtGpa(gp.gpa.value)) + row(t('grad.complete'), t('grad.pct', { n: total })) + row(t('grad.expected'), gd ? OBS.fmtShort(gd) : '-'), '#6a5ae0')}
        </div>

          ${prog('book', t('grad.mand'), gp.mandatory.done === gp.mandatory.all, `${gp.mandatory.done} <small>/ ${gp.mandatory.all}</small>`, gp.mandatory.pct, t('grad.mandNote'))}
          ${prog('folder', t('grad.elec'), gp.elective.done === gp.elective.all, `${gp.elective.done} <small>/ ${gp.elective.all}</small>`, gp.elective.pct, t('grad.elecNote'))}
          ${prog('spark', t('grad.ects'), gp.ects.done >= gp.ects.need, `${gp.ects.done} <small>/ ${gp.ects.need}</small>`, gp.ects.pct, t('grad.ectsNote'))}
          ${prog('bank', t('grad.staj'), gp.internship.pct === 100, `${gp.internship.done} <small>/ ${gp.internship.need} ${esc(t('grad.days'))}</small>`, gp.internship.pct, t('grad.stajNote'))}
          ${prog('lang', t('grad.prep'), true, esc(t('grad.exempt')), 100, t('grad.prepNote'))}
          ${prog('form', t('grad.status'), !gp.failed.length && !gp.notTaken.length, `${gp.notTaken.length} <small>${esc(t('grad.notTakenS'))}</small> · ${gp.failed.length} <small>${esc(t('grad.failedS'))}</small>`, Math.round(100 * (1 - (gp.notTaken.length + gp.failed.length) / Math.max(1, gp.mandatory.all + gp.elective.all))), t('grad.statusNote'))}
          ${prog('check', t('grad.failedT'), !gp.failed.length, gp.failed.length ? gp.failed.map((x) => esc(x.code)).join(', ') : esc(t('grad.none')), gp.failed.length ? 0 : 100, t('grad.failedNote'))}
        </div>
        ${plan && plan.graduation ? `<div class="cal-note ok">${icon('spark')}<span>${esc(t('grad.planNote', { term: ACAD.termLabel(plan.graduation, app.lang), n: plan.terms.length }))}</span><button class="btn small soft" type="button" data-goto="scenario">${esc(t('grad.planBtn'))}</button></div>` : ''}
        <div class="two-col">
          <section class="card flush"><div class="card-head pad"><h2>${esc(t('grad.notTaken'))}</h2><span class="count">${gp.notTaken.length}</span></div><div class="table-wrap"><table class="sel-table"><thead><tr><th>${esc(t('sel.code'))}</th><th>${esc(t('sel.name'))}</th><th class="num">${esc(t('sel.ects'))}</th><th>${esc(t('grad.type'))}</th><th>${esc(t('grad.groupH'))}</th></tr></thead><tbody>${lists(gp.notTaken, t('grad.none'))}</tbody></table></div></section>
          <section class="card flush"><div class="card-head pad"><h2>${esc(t('grad.failedT'))}</h2><span class="count">${gp.failed.length}</span></div><div class="table-wrap"><table class="sel-table"><thead><tr><th>${esc(t('grad.term'))}</th><th>${esc(t('sel.code'))}</th><th>${esc(t('sel.name'))}</th><th class="num">${esc(t('sel.ects'))}</th><th>${esc(t('grad.type'))}</th><th>${esc(t('grad.grade'))}</th></tr></thead><tbody>${failed || `<tr><td colspan="6" class="empty">${esc(t('grad.noRecord'))}</td></tr>`}</tbody></table></div></section>
        </div>`;

  // ---------- Olaylar ----------
  document.addEventListener('click', (e) => {

    if ((b = e.target.closest('[data-offyear]'))) { ui.offYear = b.dataset.offyear; OBS.renderView(); return; }
    if ((b = e.target.closest('[data-ttkey]'))) { ui.ttKey = b.dataset.ttkey; OBS.renderView(); return; }

    if (e.target.closest('[data-exsync]')) { OBS.googleSync(myExams().list.filter((x) => x.date >= OBS.today()).map(examEv)); }

  document.addEventListener('input', (e) => {

    ui.offQ = e.target.value;

// Ders ve Dönem İşlemleri sayfaları: Ders Ekle/Bırak, Dönem Ortalamaları, Not Listesi, Transkript, Transkript Senaryosu, Diğer Belgeler, Müfredat Durum
(function () {
  const { app, t, esc, $, toast } = OBS;
  const D = () => OBS.data();
  const MUF = () => OBS.getData().MUF;
  const head = (...a) => OBS.pageHead(...a);
  const empty = (...a) => OBS.pageEmpty(...a);
  const icon = (n) => `<svg><use href="#i-${n}"/></svg>`;
  const clone = (x) => JSON.parse(JSON.stringify(x));
  const course = (code) => { const m = MUF(); return m ? m.courses.find((c) => c.code === code) : null; };
  const scaleNow = () => OBS.scale();
  const letters = () => {
    const tr = D().transcript && D().transcript.data;
    const sample = tr && tr.terms[0] && tr.terms[0].courses[0] ? tr.terms[0].courses[0].letter : 'B';
    return ACAD.lettersFor(scaleNow(), sample);
  };
  const shortTerm = (name) => { const m = String(name).match(/(\d{2})(\d{2})-\d{2}(\d{2})\s*(\S)/); return m ? `[${m[2]}-${m[3]}${m[4].toUpperCase() === 'G' ? 'G' : m[4].toUpperCase() === 'B' ? 'B' : 'Y'}]` : name; };
  const ui = { adQ: '', adLocked: false, target: 'B', onlyMissing: false, planShown: false, expect: 'B' };

  // Geçici olarak başka bir seçim durumuyla çalış (ekle-bırak)
  function withState(state, fn) {
    const s0 = app.state, e0 = app.evalr;
    app.state = state;
    app.evalr = evaluate(app.model, state);
    try { return fn(); } finally { app.state = s0; app.evalr = e0; }
  }

  // ---------- Ders Ekle/Bırak ----------
  const AD = { base: null, state: null, key: null };
  function ensureAD() {
    const a = app.approved;
    if (AD.key !== a.date) { AD.base = clone(a.state || emptyState()); AD.state = clone(a.state || emptyState()); AD.key = a.date; }
  }
  // Seçmeli hakları dolu olsa da ders "ek ders" olarak eklenebilir mi (çakışma yok, kontenjan var)
  function extraOk(s) {
    const m = app.model;
    if (isFull(s)) return false;
    const taken = [...m.fixedIds, ...AD.state.picks.map((p) => p.id)].map((id) => m.sections.get(id)).filter(Boolean);
    return !taken.some((o) => o.code === s.code || overlaps(o, s).length);
  }
  OBS.views.adddrop = {
    title: 'side.adddrop',
    needs: ['curriculum', 'timetable', 'calendar'],
    render() {
      if (!app.approved) return head('side.adddrop') + empty(t('ad.noRegT'), t('ad.noReg'), `<button class="btn primary" type="button" data-goto="reg">${esc(t('tt.goReg'))}</button>`);
      if (!app.model) return head('side.adddrop');
      ensureAD();
      const open = OBS.periodOpen('adddrop');
      const pending = app.advisor === 'sent';
      const m = app.model;
      const out = withState(AD.state, () => ({ rows: OBS.selectedRows().rows, ev: app.evalr }));
      const baseEcts = withState(AD.base, () => app.evalr.ects);
      const baseIds = new Set(AD.base.picks.map((p) => p.id));
      const curIds = new Set(AD.state.picks.map((p) => p.id));
      const added = AD.state.picks.filter((p) => !baseIds.has(p.id));
      const dropped = AD.base.picks.filter((p) => !curIds.has(p.id));
      const listAdded = Object.entries(AD.state.listChoices).filter(([k, v]) => AD.base.listChoices[k] !== v);
      const listDropped = Object.entries(AD.base.listChoices).filter(([k, v]) => AD.state.listChoices[k] !== v);
      const changes = added.length + dropped.length + listAdded.length + listDropped.length + AD.state.picks.filter((p) => baseIds.has(p.id) && (AD.base.picks.find((b) => b.id === p.id) || {}).slot !== p.slot).length;
      const lim = OBS.ectsLimit();
      const ects = out.ev.ects;
      const dis = !open || pending ? 'disabled' : '';
      const slotOpts = (pick) => {
        const role = m.roles.get(m.sections.get(pick.id).code);
        if (!role || role.kind !== 'elective') return '';
        const fill = withState(AD.state, () => app.evalr.fill);
        const opts = role.slots.map((s) => `<option value="${s}" ${pick.slot === s ? 'selected' : ''} ${fill[s] && fill[s] !== m.sections.get(pick.id).code ? 'disabled' : ''}>${esc(t('ad.countAs', { slot: (m.electiveSlots.find((x) => x.slot === s) || {})[app.lang === 'en' ? 'nameEn' : 'name'] || s }))}</option>`).join('');
        return `<select data-adslot="${esc(pick.id)}" ${dis} aria-label="${esc(t('ad.recount'))}">${opts}<option value="" ${!pick.slot ? 'selected' : ''}>${esc(t('ad.asExtra'))}</option></select>`;
      };
      const rows = out.rows.map((r) => {
        const pick = r.removeId ? AD.state.picks.find((p) => p.id === r.removeId) : null;
        const isNew = pick && !baseIds.has(pick.id);
        const action = r.fixed ? `<span class="muted small" title="${esc(t('ad.fixedTip'))}">${icon('x')} ${esc(t('ad.fixed'))}</span>`
          : r.removeId ? `<button class="rm" type="button" data-addrop="${esc(r.removeId)}" ${dis}>${esc(t('ad.drop'))}</button>`
          : `<button class="rm" type="button" data-adslotrm="${esc(r.removeSlot)}" ${dis}>${esc(t('ad.drop'))}</button>`;
        return `<tr class="${isNew ? 'new' : ''}"><td>${r.sec}</td><td><span class="sw" style="--c:${r.color}"></span><b>${esc(r.code)}</b>${isNew ? ` <span class="kpill k-new">${esc(t('ad.new'))}</span>` : ''}</td><td>${esc(r.name)}</td><td>${pick ? slotOpts(pick) || esc(r.type) : esc(r.type)}</td><td class="num">${r.ects}</td><td class="num">${action}</td></tr>`;
      }).join('');
      const droppedRows = [...dropped.map((p) => { const s = m.sections.get(p.id); return { key: p.id, code: s.code, sec: s.section, undo: `data-adundo="${esc(p.id)}"` }; }), ...listDropped.map(([k, v]) => ({ key: k, code: v, sec: '-', undo: `data-adundolist="${esc(k)}"` }))]
        .map((x) => `<tr class="dropped"><td>${x.sec}</td><td><b>${esc(x.code)}</b> <span class="kpill k-drop">${esc(t('ad.dropped'))}</span></td><td>${esc(OBS.name(x.code))}</td><td></td><td></td><td class="num"><button class="rm" type="button" ${x.undo} ${dis}>${esc(t('ad.undo'))}</button></td></tr>`).join('');
      // Eklenebilecek şubeler
      const q = ui.adQ.toLocaleLowerCase('tr');
      const selectedCodes = new Set(out.rows.map((r) => r.code));
      const groups = new Map();
      for (const s of m.sections.values()) {
        if (s.term !== app.term || selectedCodes.has(s.code)) continue;
        const st = out.ev.status.get(s.id);
        if (!st || st.state === 'passed') continue;
        if (!ui.adLocked && st.state !== 'free' && !(st.state === 'slot-full' && extraOk(s))) continue;
        if (q && !s.code.toLocaleLowerCase('tr').includes(q) && !OBS.name(s.code).toLocaleLowerCase('tr').includes(q)) continue;
        if (!groups.has(s.code)) groups.set(s.code, []);
        groups.get(s.code).push({ s, st });
      }
      const addBtn = (s, st) => {
        if (st.state === 'free') return `<button class="btn small primary" type="button" data-adadd="${esc(s.id)}" ${dis}>${icon('plus')}${esc(t('ad.add'))}</button>`;
        if (st.state === 'slot-full' && extraOk(s)) return `<button class="btn small soft" type="button" data-adextra="${esc(s.id)}" ${dis} title="${esc(reasonOf(s.id, st))}">${icon('plus')}${esc(t('ad.addExtra'))}</button>`;
        return `<span class="lock-why">${esc(reasonOf(s.id, st))}</span>`;

  // ---------- Dönem Ortalamaları ----------
  function bars(values, labels, color) {
    const W = 560, H = 290, l = 40, b = 70, top = 14;
    const cw = (W - l - 10) / Math.max(1, values.length);
    const y = (v) => top + (H - top - b) * (1 - v / 4);
    let g = '';
    for (let v = 0; v <= 4.0001; v += 0.4) g += `<line x1="${l}" x2="${W - 6}" y1="${y(v)}" y2="${y(v)}" class="gl"/><text x="${l - 6}" y="${y(v) + 4}" class="ax" text-anchor="end">${v.toFixed(2)}</text>`;
    values.forEach((v, i) => {
      const x = l + i * cw + cw * 0.2, w = cw * 0.6;
      if (v != null) g += `<rect x="${x}" y="${y(v)}" width="${w}" height="${y(0) - y(v)}" rx="4" fill="${color(i)}"/><text x="${x + w / 2}" y="${Math.max(y(v) + 16, top + 12)}" class="bv" text-anchor="middle">${OBS.fmtGpa(v)}</text>`;
      g += `<text transform="translate(${x + w / 2},${H - b + 14}) rotate(-35)" class="ax" text-anchor="end">${esc(labels[i])}</text>`;
    });
    return `<svg viewBox="0 0 ${W} ${H}" class="barchart" role="img">${g}</svg>`;
  }

  // ---------- Not Listesi (öğrencinin kendi girdiği notlarla hesaplayıcı) ----------
  const defComps = () => [{ n: t('gb.mid'), w: 40, s: '' }, { n: t('gb.final'), w: 60, s: '' }];
  function gbCalc(comps, target) {
    const num = (v) => (v === '' || v == null || isNaN(+v) ? null : +v);
    let fw = 0, fs = 0, rw = 0, tw = 0;
    for (const c of comps) { const w = num(c.w) || 0; tw += w; const s = num(c.s); if (s == null) rw += w; else { fw += w; fs += (w * s) / 100; } }
    const cur = fw ? (fs / fw) * 100 : null;
    const need = rw ? ((target - fs) / rw) * 100 : null;
    return { cur, need, tw, rw, total: fs };
  }

  function gbResHtml(code) {
    const gb = app.gradebook || {};
    const comps = (gb[code] && gb[code].comps) || defComps();
    const r = gbCalc(comps, gb._target ?? 50);
    let res;
    if (r.tw !== 100) res = `<span class="bad">${esc(t('gb.weights', { n: r.tw }))}</span>`;
    else if (r.need == null) res = `<span>${esc(t('gb.done', { n: r.total.toFixed(1) }))}</span>`;
    else if (r.need <= 0) res = `<span class="good">${esc(t('gb.reached'))}</span>`;
    else if (r.need > 100) res = `<span class="bad">${esc(t('gb.impossible', { n: Math.ceil(r.need) }))}</span>`;
    else res = `<span>${esc(t('gb.need', { n: Math.ceil(r.need) }))}</span>`;
    return `<span class="muted small">${esc(t('gb.cur'))}</span> <b>${r.cur == null ? '-' : r.cur.toFixed(1)}</b><br>${res}`;
  }

      const size = (n) => (n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB');
      return head('side.otherDocs', t('docs.lead'), `<button class="btn primary" type="button" data-upload="docs">${icon('upload')}${esc(t('docs.add'))}</button>`) +
        `<section class="card flush"><div class="table-wrap"><table class="sel-table"><thead><tr><th>${esc(t('docs.name'))}</th><th>${esc(t('docs.kind'))}</th><th class="num">${esc(t('docs.size'))}</th><th>${esc(t('docs.date'))}</th><th></th></tr></thead><tbody>
        ${docs.map((d) => `<tr><td>${icon('file')} <b>${esc(d.name)}</b></td><td><span class="pill">${esc(d.kind === 'docs' ? t('docs.other') : t('dc.k.' + d.kind))}</span></td><td class="num">${size(d.size)}</td><td>${esc(OBS.fmtDate(d.date, true))}</td><td class="num nowrap"><button class="icon-btn small" type="button" data-dl="${d.id}" title="${esc(t('dc.download'))}">${icon('download')}</button><button class="icon-btn small" type="button" data-rmdoc="${d.id}" title="${esc(t('dc.remove'))}">${icon('trash')}</button></td></tr>`).join('') || `<tr><td colspan="5" class="empty">${esc(t('docs.none'))}</td></tr>`}
        </tbody></table></div></section>`;
    },
  };

  // ---------- Müfredat Durum ----------
  OBS.views.curr = {
    title: 'side.curr',
    needs: ['curriculum', 'transcript'],
    render() {
      const tr = D().transcript.data;
      const cs = ACAD.curriculumStatus(MUF(), tr, { scale: scaleNow(), eq: OBS.eq() });
      const below = app.rules.retakeBelow;
      const sc = scaleNow();
      const lim = sc[below] ?? 1.7;
      const rs = ACAD.retakeSuggestions(tr, { scale: sc, eq: OBS.eq(), below, target: ui.target });
      const L = letters().filter((l) => (sc[l] ?? 0) > lim);
      const st = OBS.student();
      const maxGain = Math.max(0.01, ...rs.items.map((x) => x.gain));
      const sum = cs.summary;
      const retakeCard = `<section class="card retake-card"><div class="card-head"><h2>${icon('spark')}${esc(t('cu.rtTitle'))}</h2>
          <label class="chk small">${esc(t('cu.rtTarget'))} <select data-target>${L.map((l) => `<option ${l === ui.target ? 'selected' : ''}>${l}</option>`).join('')}</select></label></div>
          <p class="muted small">${esc(t('cu.rtLead', { below }))}${D().regulation && D().regulation.data.evidence.retakeBelow ? ` <span class="found" title="${esc(D().regulation.data.evidence.retakeBelow)}">${esc(t('rules.found'))}</span>` : ''}</p>
          ${rs.items.length ? `<div class="rt-list">${rs.items.map((x) => `<div class="rt-row"><b>${esc(x.code)}</b><span>${esc(OBS.name(x.code))}</span><span class="muted small">${x.ects} ${esc(t('sel.ects'))} · ${esc(x.term)}</span><span class="rt-l">${esc(x.letter)} → ${esc(x.target)}</span><div class="rt-bar"><i style="width:${Math.max(4, (x.gain / maxGain) * 100)}%"></i></div><span class="rt-g">+${OBS.fmtGpa(x.gain)}</span></div>`).join('')}</div>
            <div class="rt-all">${esc(t('cu.rtAll', { from: OBS.fmtGpa(rs.base), to: OBS.fmtGpa(rs.allAgno), n: rs.items.length, target: ui.target }))}<button class="btn small soft" type="button" data-rttry>${esc(t('cu.rtTry'))}</button></div>` : `<p>${esc(t('cu.rtNone', { below }))}</p>`}
        </section>`;
      const retakeSet = new Set(rs.items.map((x) => x.code));
      const sems = cs.rows.map((r) => {
        const items = ui.onlyMissing ? r.items.filter((x) => !x.taken || !x.taken.passed) : r.items;
        if (!items.length) return '';
        const y = Math.ceil(r.semester / 2), tm = r.semester % 2 ? 'guz' : 'bahar';
        return `<section class="card flush cu-sem"><div class="cu-h">${icon('cal')}<b>${esc(t('cu.sem', { y, term: t('tshort.' + tm) }))}</b></div>
          <div class="table-wrap"><table class="cu-t"><thead><tr><th>${esc(t('sel.code'))}</th><th>${esc(t('cu.cname'))}</th><th>Z/S</th><th class="num">${esc(t('tr.credit'))}</th><th class="num">${esc(t('sel.ects'))}</th><th class="sep">${esc(t('avg.term'))}</th><th>${esc(t('sel.code'))}</th><th>${esc(t('sel.name'))}</th><th class="num">${esc(t('tr.letter'))}</th></tr></thead><tbody>
          ${items.map((x) => {
            const tk = x.taken;
            const nm = x.kind === 'slot' ? (app.lang === 'en' ? x.nameEn : x.name) : OBS.name(x.code);
            return `<tr class="${tk ? (tk.passed ? 'ok' : 'bad') : 'none'}"><td><b>${esc(x.kind === 'slot' ? 'ELECT ' + x.code : x.code)}</b></td><td>${esc(nm)}</td><td>${x.zs}</td><td class="num">${x.credit || 0}</td><td class="num">${x.ects}</td>
              <td class="sep">${tk ? esc(shortTerm(tk.term)) : ''}</td><td>${tk ? esc(tk.code) : ''}</td><td>${tk ? esc(OBS.name(tk.code) !== tk.code ? OBS.name(tk.code) : OBS.titleCase(tk.name || '')) : ''}</td>
              <td class="num">${tk ? `<b>${esc(tk.letter)}</b> ${tk.passed ? `<span class="gi ok">${OBS.CHECK}</span>` : `<span class="gi no">${icon('x')}</span>`}${retakeSet.has(tk.code) ? ` <span class="up-tag" title="${esc(t('cu.canRetake'))}">↑</span>` : ''}` : ''}</td></tr>`;
          }).join('')}</tbody></table></div>
          <div class="cu-f">${esc(t('cu.foot', { c: r.credit, e: r.ects, n: r.items.length, z: r.z, s: r.s }))}</div></section>`;
      }).join('');
      const tile = (ic, title, lines, cls) => `<section class="cu-tile ${cls}">${icon(ic)}<div><b>${esc(title)}</b>${lines.map((l) => `<span>${esc(l)}</span>`).join('')}</div></section>`;
      return head('side.curr', t('cu.lead', { name: (D().curriculum.file.name || '').replace(/\.\w+$/, '') })) +
        `<div class="cu-tiles">
          ${tile('info', t('cu.taken'), [t('cu.cr', { n: sum.takenCredit }), t('cu.ec', { n: sum.takenEcts }), `${t('avg.agno')}: ${OBS.fmtGpa(sum.gpa)}`, t('cu.cls', { n: st ? st.year : app.profile.year })], 'blue')}
          ${tile('chart', t('cu.passed'), [t('cu.cr', { n: sum.passedCredit }), t('cu.ec', { n: sum.passedEcts })], 'green')}
          ${tile('folder', t('cu.excluded'), [t('cu.cr', { n: 0 }), t('cu.ec', { n: 0 })], 'red')}
          <section class="cu-tile btns"><button class="btn small soft ${ui.onlyMissing ? 'on' : ''}" type="button" data-onlymissing>${esc(t('cu.onlyMissing'))}</button><button class="btn small soft" type="button" data-print>${icon('print')}${esc(t('cu.print'))}</button></section>
        </div>
        ${retakeCard}${sems}`;
    },
  };

  // ---------- Olaylar ----------
  function rerenderKeep(id) {
    const el = $(id);
    const pos = el && el.selectionStart;
    OBS.renderView();
    const n = $(id);
    if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) { /* sayı alanı */ } }
  }
  document.addEventListener('click', (e) => {
    const q = (s) => e.target.closest(s);
    let b;
    const m = app.model;
    if ((b = q('[data-addrop]'))) { AD.state = { ...AD.state, picks: AD.state.picks.filter((p) => p.id !== b.dataset.addrop) }; OBS.renderView(); return; }
    if ((b = q('[data-adslotrm]'))) { AD.state = setListChoice(m, AD.state, b.dataset.adslotrm, null).state; OBS.renderView(); return; }
    if ((b = q('[data-adundolist]'))) { const k = b.dataset.adundolist; AD.state = { ...AD.state, listChoices: { ...AD.state.listChoices, [k]: AD.base.listChoices[k] } }; OBS.renderView(); return; }
    if ((b = q('[data-adadd]')) || (b = q('[data-adundo]'))) {
      const id = b.dataset.adadd || b.dataset.adundo;
      const r = toggleSection(m, AD.state, id);
      if (r.ok) { AD.state = r.state; const s = m.sections.get(id); toast(t('t.added', { code: s.code, n: s.section })); }
      else toast(t('ad.cannot'));
      OBS.renderView();
      return;
    }
    if ((b = q('[data-adextra]'))) {
      const s = m.sections.get(b.dataset.adextra);
      if (extraOk(s)) { AD.state = { ...AD.state, picks: [...AD.state.picks, { id: s.id, slot: null }] }; toast(t('ad.addedExtra', { code: s.code })); }
      OBS.renderView();
      return;
    }
    if (q('[data-adreset]')) { AD.state = clone(AD.base); OBS.renderView(); return; }
    if (q('[data-adsend]')) {
      const baseIds = new Set(AD.base.picks.map((p) => p.id));
      const curIds = new Set(AD.state.picks.map((p) => p.id));
      const added = AD.state.picks.filter((p) => !baseIds.has(p.id)).map((p) => m.sections.get(p.id).code);
      const dropped = AD.base.picks.filter((p) => !curIds.has(p.id)).map((p) => m.sections.get(p.id).code);
      const snap = withState(AD.state, () => OBS.snapshot());
      app.state = clone(AD.state);
      OBS.submitForApproval('adddrop', snap, { added, dropped });
      toast(t('ad.sent'));
      OBS.renderView();
      return;
    }
    if (q('[data-adlocked]')) { ui.adLocked = !ui.adLocked; OBS.renderView(); return; }
    if ((b = q('[data-gbadd]'))) { const gb = app.gradebook; const c = b.dataset.gbadd; gb[c] = gb[c] || { comps: defComps() }; gb[c].comps.push({ n: t('gb.hw'), w: 0, s: '' }); gbSave(); OBS.renderView(); return; }
    if ((b = q('[data-gbrm]'))) { const gb = app.gradebook; const c = b.dataset.gbrm; gb[c] = gb[c] || { comps: defComps() }; gb[c].comps.splice(+b.dataset.i, 1); gbSave(); OBS.renderView(); return; }
    if (q('[data-print]')) { document.body.classList.add('print-page'); window.print(); setTimeout(() => document.body.classList.remove('print-page'), 800); return; }
    if (q('[data-trcsv]')) {
      const tr = D().transcript.data;
      const rows = [['Dönem', 'Ders Kodu', 'Ders Adı', 'Kredi', 'AKTS', 'Başarı Notu', 'Harf Notu', 'Z/S']];
      for (const term of tr.terms) for (const c of term.courses) rows.push([term.name, c.code, c.name, c.credit, c.ects, c.score ?? '', c.letter, c.zs || '']);
      OBS.download('transkript.csv', '﻿' + rows.map((r) => r.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(';')).join('\r\n'), 'text/csv');
      return;
    }
    if ((b = q('[data-scrm]'))) { scenario()[+b.dataset.scrm].courses.splice(+b.dataset.ci, 1); app.scenario = app.scenario.filter((x) => x.courses.length || !x.planned); OBS.saveState(); OBS.renderView(); return; }
    if ((b = q('[data-scadd]'))) { scenario()[+b.dataset.scadd].courses.push({ code: '', name: '', credit: 0, ects: 6, score: null, letter: ui.expect, zs: 'Z', isNew: true }); OBS.saveState(); OBS.renderView(); return; }
    if (q('[data-scterm]')) { const s = scenario(); const last = s[s.length - 1]; const n = ACAD.nextTerm(last.year, last.term); s.push({ name: ACAD.termLabel(n, 'tr'), year: n.year, term: n.term, courses: [{ code: '', name: '', credit: 0, ects: 6, score: null, letter: ui.expect, zs: 'Z', isNew: true }] }); OBS.saveState(); OBS.renderView(); return; }
    if (q('[data-screset]')) { app.scenario = null; ui.planShown = false; OBS.saveState(); OBS.renderView(); toast(t('sc.resetDone')); return; }
    if (q('[data-plan]')) { ui.planShown = true; OBS.renderView(); return; }
    if (q('[data-planadd]')) { addPlanToScenario(); return; }
    if (q('[data-onlymissing]')) { ui.onlyMissing = !ui.onlyMissing; OBS.renderView(); return; }
    if (q('[data-rttry]')) {
      const tr = D().transcript.data;
      const rs = ACAD.retakeSuggestions(tr, { scale: scaleNow(), eq: OBS.eq(), below: app.rules.retakeBelow, target: ui.target });
      const s = clone(tr.terms);
      const n = ACAD.nextTerm(s[s.length - 1].year, s[s.length - 1].term);
      s.push({ name: ACAD.termLabel(n, 'tr'), year: n.year, term: n.term, planned: true, courses: rs.items.map((x) => ({ code: x.code, name: x.name, credit: (course(x.code) || {}).credit || 0, ects: x.ects, score: null, letter: ui.target, zs: 'Z' })) });
      app.scenario = s;
      OBS.saveState();
      OBS.setView('scenario');
    }
  });
  document.addEventListener('change', (e) => {
    const el = e.target;
    const m = app.model;
    if (el.dataset.adslot != null) {
      const r = reassignSlot(m, AD.state, el.dataset.adslot, el.value || null);
      if (r.ok) AD.state = r.state; else toast(t('ad.slotTaken'));
      OBS.renderView();
      return;
    }
    if (el.dataset.sc != null) {
      const c = scenario()[+el.dataset.sc].courses[+el.dataset.ci];
      const f = el.dataset.f;
      if (f === 'letter') { c.letter = el.value; c.changed = true; }
      if (f === 'ects') c.ects = +el.value || 0;
      if (f === 'name') c.name = el.value;
      if (f === 'code') {
        const code = PARSE.normCode(el.value) || el.value.trim().toUpperCase();
        c.code = code;
        const k = course(code);
        if (k) { c.name = k.name; c.ects = k.ects; c.credit = k.credit || 0; }
      }
      OBS.saveState();
      OBS.renderView();
      return;
    }
    if (el.dataset.expect != null) { ui.expect = el.value; OBS.renderView(); return; }
    if (el.dataset.target != null) { ui.target = el.value; OBS.renderView(); }
  });
  document.addEventListener('input', (e) => {
    const el = e.target;
    if (el.id === 'adQ') { ui.adQ = el.value; rerenderKeep('adQ'); return; }
    if (el.dataset.gbtarget != null) { app.gradebook._target = Math.max(0, Math.min(100, +el.value || 0)); gbSave(); gbRefresh(); return; }
    if (el.dataset.gb != null) {
      const gb = app.gradebook;
      const c = el.dataset.gb;
      gb[c] = gb[c] || { comps: defComps() };
      const comp = gb[c].comps[+el.dataset.i];
      comp[el.dataset.f] = el.dataset.f === 'n' ? el.value : el.value === '' ? '' : Math.max(0, Math.min(100, +el.value));
      gbSave();
      gbRefresh();
    }
  });
})();

OBS.boot();
</script>
</body>
</html>
